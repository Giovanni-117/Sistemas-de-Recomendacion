# ==============================================================================
#  config.toml — Gorse: Modelo Híbrido con Ranking, Boosting y Caja Blanca
# ==============================================================================

# ------------------------------------------------------------------------------
# [database]
# ------------------------------------------------------------------------------
[database]
table_prefix = "gorse_"

# ------------------------------------------------------------------------------
# [master]
# ------------------------------------------------------------------------------
[master]
host                = "0.0.0.0"
port                = 8086
http_host           = "0.0.0.0"
http_port           = 8088
n_jobs              = 2
meta_timeout        = "10s"
dashboard_user_name = "admin"
dashboard_password  = "admin123"

# ------------------------------------------------------------------------------
# [server]
# ------------------------------------------------------------------------------
[server]
default_n        = 10
api_key          = "secret-api-key-change-me"
auto_insert_user = true
auto_insert_item = true
clock_error      = "5s"
cache_expire     = "10s"

# ------------------------------------------------------------------------------
# [recommend]
# ------------------------------------------------------------------------------
[recommend]
cache_size   = 100
cache_expire = "72h"
context_size = 50

[recommend.data_source]
positive_feedback_types = ["like", "purchase", "star"]
read_feedback_types     = ["read", "view"]
negative_feedback_types = ["dislike"]
positive_feedback_ttl   = 90    # uint (días) — NO usar strings como "2160h"
item_ttl                = 180   # uint (días) — NO usar strings como "4320h"

# ==============================================================================
#  CAJA BLANCA / RECOMENDACIÓN ORGÁNICA — Non-personalized
# ==============================================================================

[[recommend.non-personalized]]
name  = "latest"
score = "item.Timestamp.Unix()"

[[recommend.non-personalized]]
name   = "trending"
score  = "(count(feedback, .FeedbackType == 'like') - 1) / ((now() - item.Timestamp).Seconds() + 2) ^ 0.5"

[[recommend.non-personalized]]
name   = "most_liked_weekly"
score  = "count(feedback, .FeedbackType == 'like')"
filter = "(now() - item.Timestamp).Hours() < 168"

[[recommend.non-personalized]]
name   = "top_purchased"
score  = "count(feedback, .FeedbackType == 'purchase')"
filter = "(now() - item.Timestamp).Hours() < 720"

# ==============================================================================
#  MODELO HÍBRIDO — Item-to-Item
#
#  Tipos válidos: "embedding" | "tags" | "users"
#  IMPORTANTE:
#    - "embedding" y "tags" → column es obligatorio (expresión Expr)
#    - "users"              → column debe estar AUSENTE del bloque
# ==============================================================================

# Similitud por tags/etiquetas — caja blanca, basada en metadatos del ítem
[[recommend.item-to-item]]
name   = "neighbors"
type   = "tags"
column = "item.Labels"

# Similitud por co-interacción: ítems que los mismos usuarios han preferido juntos
# type = "users" → NO incluir campo column
[[recommend.item-to-item]]
name = "covisit"
type = "users"

# ==============================================================================
#  MODELO HÍBRIDO — User-to-User
#
#  Tipos válidos: "embedding" | "tags" | "items"
#  IMPORTANTE:
#    - "embedding" y "tags" → column es obligatorio (expresión Expr)
#    - "items"              → column debe estar AUSENTE del bloque
# ==============================================================================

# Similitud por ítems favoritos en común
# type = "items" → NO incluir campo column
[[recommend.user-to-user]]
name = "similar_users"
type = "items"

# ==============================================================================
#  MODELO HÍBRIDO — Collaborative Filtering (Matrix Factorization)
# ==============================================================================

[recommend.collaborative]
type            = "mf"
fit_period      = "60m"
fit_epoch       = 100
optimize_period = "360m"
optimize_trials = 10

[recommend.collaborative.early_stopping]
patience = 10

# ==============================================================================
#  RANKING Y BOOSTING — Factorization Machines
# ==============================================================================

[recommend.ranker]
type = "fm"
recommenders = [
  "latest",
  "collaborative",
  "non-personalized/trending",
  "non-personalized/most_liked_weekly",
  "non-personalized/top_purchased",
  "item-to-item/neighbors",
  "item-to-item/covisit",
  "user-to-user/similar_users",
]
fit_period      = "60m"
fit_epoch       = 100
optimize_period = "360m"
optimize_trials = 10
cache_expire    = "120h"

[recommend.ranker.early_stopping]
patience = 10

# ------------------------------------------------------------------------------
[recommend.replacement]
enable_replacement         = true
positive_replacement_decay = 0.8
read_replacement_decay     = 0.6

[recommend.fallback]
recommenders = ["non-personalized/trending", "latest"]