version: "3.9"

# =============================================================================
#  Gorse – gorse-in-one (single node) con modelo híbrido
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # 1. Redis Stack — cache store con RediSearch
  #
  #  FIX: Gorse moderno usa FT._LIST (RediSearch). Redis vanilla no lo tiene.
  #  redis/redis-stack-server = Redis + RediSearch + RedisJSON + RedisTimeSeries
  # ---------------------------------------------------------------------------
  redis:
    image: redis/redis-stack-server:latest
    container_name: gorse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. PostgreSQL — data store
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: gorse_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gorse
      POSTGRES_USER: gorse
      POSTGRES_PASSWORD: gorse_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gorse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 3. gorse-in-one — master + server + worker en un único contenedor
  # ---------------------------------------------------------------------------
  gorse:
    image: zhenghaoz/gorse-in-one:latest
    container_name: gorse
    restart: unless-stopped
    ports:
      - "8087:8087"   # RESTful API  → http://localhost:8087
      - "8088:8088"   # Dashboard    → http://localhost:8088
    environment:
      GORSE_DATA_STORE:          postgres://gorse:gorse_pass@postgres:5432/gorse?sslmode=disable
      GORSE_CACHE_STORE:         redis://redis:6379/0
      GORSE_DASHBOARD_USER_NAME: admin
      GORSE_DASHBOARD_PASSWORD:  admin123
    command: >
      -c /etc/gorse/config.toml
    volumes:
      - ./config/config.toml:/etc/gorse/config.toml:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data: